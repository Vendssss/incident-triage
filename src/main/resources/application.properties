spring.application.name=incident-triage

# Database: URL and username have local defaults; the password must come from the environment
spring.datasource.url=${TRIAGE_DB_URL:jdbc:postgresql://localhost:5432/incident_triage}
spring.datasource.username=${TRIAGE_DB_USERNAME:triage_app}
spring.datasource.password=${TRIAGE_DB_PASSWORD}

# JWT: the signing key must come from the environment (Base64, at least 256 bits)
triage.jwt.secret=${TRIAGE_JWT_SECRET}
triage.jwt.issuer=incident-triage
triage.jwt.ttl=15m

# Schema is owned by Flyway migrations; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
